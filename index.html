<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B4BFF">
<title>Hilos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--canvas:#EEF0F7;--panel:#fff;--ink:#0F1423;--muted:#6B7287;--line:#E7E9F2;--accent:#5B4BFF;--on:#fff;--theirs:#F1F2F8;--sel:#F0EEFF;--hover:#F6F7FB;--danger:#D6403A;--sh:0 1px 2px rgba(15,20,35,.04),0 8px 30px rgba(15,20,35,.06);--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--canvas:#0B0D14;--panel:#141824;--ink:#E8EAF3;--muted:#8A91A8;--line:#232838;--accent:#7D70FF;--on:#0B0A1F;--theirs:#1D2233;--sel:#1E1F3A;--hover:#191E2D;--danger:#FF7A72;--sh:0 8px 30px rgba(0,0,0,.25)}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.5 var(--f);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
textarea{resize:none}.hidden{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--hover)}.btn.p{background:var(--accent);color:var(--on);border-color:var(--accent)}.btn.p:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55}
.btn.i{width:40px;height:40px;padding:0;border-color:transparent;background:none;color:var(--muted)}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:15px}
.av.s{width:26px;height:26px;font-size:10px;border:2px solid var(--panel)}.av.g{background:var(--muted)!important}
.stack{display:flex}.stack .av+.av{margin-left:-9px}
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border-radius:26px;padding:34px;width:100%;max-width:420px;box-shadow:var(--sh)}
.brand{font-weight:800;font-size:38px;letter-spacing:-.04em;line-height:1;margin:0 0 8px}.brand i{font-style:normal;color:var(--accent)}
.lead{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--canvas);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.field{margin-bottom:14px}.field>label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.err{color:var(--danger);min-height:22px;margin:2px 0 10px;font-size:14px}
#net{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;text-align:center;padding:6px;font-size:13px;z-index:9}
#app{height:100%;height:100dvh;display:grid;grid-template-columns:392px 1fr;gap:12px;padding:12px}
#side,#main{background:var(--panel);border-radius:26px;box-shadow:var(--sh);min-height:0;overflow:hidden}
#side{position:relative;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:6px;padding:20px 18px 10px 22px}.top .brand{font-size:28px;margin:0;flex:1}
.top .av{width:36px;height:36px;font-size:13px}
.search{margin:6px 18px 12px}.search input{border-radius:999px;background:var(--canvas);border-color:transparent}
#list{flex:1;overflow:auto;padding:0 10px 90px}
.row{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:18px;margin-bottom:2px}
.row:hover{background:var(--hover)}.row.cur{background:var(--sel)}.rb{flex:1;min-width:0}
.r1,.r3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.subj{font-weight:600;letter-spacing:-.01em}.time{color:var(--muted);font-size:12px;white-space:nowrap}
.subj,.ppl,.snip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppl{color:var(--muted);font-size:12.5px}.snip{color:var(--muted);font-size:14px}
.badge{background:var(--accent);color:var(--on);border-radius:999px;font-size:12px;font-weight:700;min-width:21px;height:21px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center}
.row.un .subj{font-weight:800}.row.un .snip{color:var(--ink);font-weight:500}
.empty{color:var(--muted);padding:44px 24px;text-align:center}
#fab{position:absolute;right:24px;bottom:24px;height:52px;padding:0 22px 0 18px;border-radius:999px;box-shadow:0 10px 30px rgba(91,75,255,.4)}
#main{display:flex;flex-direction:column}
#ph{margin:auto;text-align:center;color:var(--muted);padding:24px}#ph h2{font-size:24px;letter-spacing:-.02em;color:var(--ink);margin:0 0 6px}
.view{display:flex;flex-direction:column;min-height:0;flex:1}
.vh{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.vh .t{flex:1;min-width:0}.vh h2{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.2;margin:0;overflow-wrap:anywhere}
.vh .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none}
#msgs{flex:1;overflow:auto;padding:12px 28px 8px;display:flex;flex-direction:column}
.day{text-align:center;margin:18px 0 8px}.day span{color:var(--muted);font-size:12px;font-weight:600;background:var(--canvas);border-radius:999px;padding:3px 12px}
.msg{display:flex;flex-direction:column;max-width:min(560px,80%);margin-top:3px}.msg.f{margin-top:12px}
.msg.me{align-self:flex-end;align-items:flex-end}.msg.th{align-self:flex-start;align-items:flex-start}
.mn{font-size:12px;font-weight:700;margin:0 12px 3px}
.bub{background:var(--theirs);border-radius:20px;padding:9px 15px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me .bub{background:#5B4BFF;color:#fff}.msg.f.th .bub{border-top-left-radius:6px}.msg.f.me .bub{border-top-right-radius:6px}
.bub a{color:inherit;text-decoration:underline}.mt{float:right;margin:7px 0 0 14px;font-size:11px;opacity:.65}
.comp{display:flex;gap:10px;align-items:flex-end;margin:8px 18px 18px;padding:6px 6px 6px 18px;background:var(--canvas);border-radius:26px}
.comp textarea{border:0;background:none;padding:9px 0;max-height:150px;min-height:40px;border-radius:0}.comp textarea:focus-visible{outline:none}
.comp:focus-within{outline:2px solid var(--accent)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on);display:grid;place-items:center;flex:none}
.form{padding:26px 30px;max-width:720px;width:100%;display:flex;flex-direction:column;gap:6px;overflow:auto}
.form h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 14px}
.tobox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.tobox:focus-within{outline:2px solid var(--accent);outline-offset:2px}.tobox input{border:0;outline:0!important;flex:1;min-width:150px;padding:6px;background:none}
.chip{display:inline-flex;align-items:center;background:var(--sel);border-radius:999px;padding:3px 4px 3px 12px;font-weight:600;font-size:14px}
.chip button{border:0;background:none;padding:0 7px;font-size:17px;line-height:1;color:var(--muted)}
@media(max-width:820px){#app{grid-template-columns:1fr;padding:0;gap:0}#side,#main{border-radius:0;box-shadow:none}#main{display:none}
body.open #side{display:none}body.open #main{display:flex}.back{display:inline-flex}#msgs{padding-left:14px;padding-right:14px}.msg{max-width:88%}
.comp{margin:8px 12px calc(12px + env(safe-area-inset-bottom))}.form{padding:18px}}
</style>
</head>
<body>

<div id="net" class="hidden" role="status"></div>

<section id="auth">
  <div class="card">
    <h1 class="brand">Hilos<i>.</i></h1>
    <p class="lead">Conversaciones con asunto, como un correo. Respuestas al instante, como un chat. Cifradas de extremo a extremo.</p>
    <div class="tabs"><button id="tL" class="on">Entrar</button><button id="tR">Crear cuenta</button></div>
    <form id="af">
      <div class="field hidden" id="fN"><label for="dn">Tu nombre</label><input id="dn" maxlength="30" autocomplete="name"></div>
      <div class="field"><label for="u">Usuario</label><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required></div>
      <div class="err" id="ae" role="alert"></div>
      <button class="btn p" id="go" style="width:100%;padding:12px">Entrar</button>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <aside id="side">
    <div class="top"><h1 class="brand">Hilos<i>.</i></h1>
      <button class="btn i" id="out" title="Cerrar sesión" aria-label="Cerrar sesión"><svg class="ic" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      <span id="meAv"></span></div>
    <div class="search"><input id="q" type="search" placeholder="Buscar hilos" aria-label="Buscar"></div>
    <div id="list" aria-live="polite"></div>
    <button class="btn p" id="fab"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuevo hilo</button>
  </aside>
  <main id="main">
    <div id="ph"><h2>Elige un hilo</h2><p>O empieza uno nuevo con el botón de la izquierda.</p></div>
    <section class="view hidden" id="tv">
      <div class="vh">
        <button class="btn i back" id="b1" aria-label="Volver"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="stack" id="stk"></div>
        <div class="t"><h2 id="ts"></h2><div class="sub" id="tp"></div></div>
      </div>
      <div id="msgs"></div>
      <div class="comp"><textarea id="rp" rows="1" placeholder="Escribe una respuesta" aria-label="Respuesta"></textarea>
        <button class="send" id="sd" aria-label="Enviar"><svg class="ic" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M3.4 20.4 21 12 3.4 3.6l.01 6.5L15 12 3.4 13.9z"/></svg></button></div>
    </section>
    <section class="view hidden" id="cv">
      <form class="form" id="nf">
        <button type="button" class="btn i back" id="b2" aria-label="Volver" style="margin-left:-8px"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2>Nuevo hilo</h2>
        <div class="field"><label for="to">Para</label><div class="tobox"><span id="chips" style="display:contents"></span><input id="to" placeholder="Usuario y Enter" autocomplete="off" autocapitalize="none" spellcheck="false"></div></div>
        <div class="field"><label for="ns">Asunto</label><input id="ns" maxlength="120" placeholder="De qué trata este hilo"></div>
        <div class="field"><label for="nt">Mensaje</label><textarea id="nt" rows="7" maxlength="5000"></textarea></div>
        <div class="err" id="ne" role="alert"></div>
        <div style="display:flex;gap:10px"><button class="btn p" id="ng">Enviar</button><button type="button" class="btn" id="nc">Cancelar</button></div>
      </form>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1240/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1240/sea.js"></script>
<script>
/* APP_ID: espacio propio dentro de la red Gun. Cámbialo por una cadena tuya (así tus datos no se mezclan con los de nadie).
   PEERS: servidores relay de Gun. Los públicos pueden caer; lo ideal es tener uno propio. */
const APP_ID='hilos_cambia_esto_x7k2p9';
const PEERS=['https://relay.peer.ooo/gun','https://gun-relay-3dvr.fly.dev/gun','https://peer.wallie.io/gun'];

(function(){
const $=s=>document.querySelector(s);
if(typeof Gun==='undefined'||!Gun.SEA){$('#ae').textContent='No se pudo cargar la librería Gun. Revisa tu conexión.';return}
const gun=Gun({peers:PEERS}),user=gun.user(),G=gun.get(APP_ID);
let me=null,T={},open=null,cmp=[],LR={},mode='login',q='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=t=>esc(t).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const hhmm=t=>new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const same=(a,b)=>a.toDateString()===b.toDateString(),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const dayL=t=>{const d=new Date(t),n=new Date();return same(d,n)?'Hoy':same(d,ago(1))?'Ayer':d.toLocaleDateString('es-ES',{day:'numeric',month:'long'})};
const lt=t=>{const d=new Date(t);return same(d,new Date())?hhmm(t):same(d,ago(1))?'Ayer':d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const av=(p,c='')=>`<span class="av ${c}" style="background:hsl(${hue(p.p)} 50% 42%)" aria-hidden="true">${esc((p.n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase())}</span>`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const key=()=>btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))));
const once=(c,ms=6000)=>new Promise(r=>{let d=0;const f=v=>{if(!d){d=1;r(v)}};c.on((v,k,_,ev)=>{if(v!==undefined){f(v);ev&&ev.off&&ev.off()}});setTimeout(()=>f(null),ms)});
const enc=(o,k)=>SEA.encrypt(JSON.stringify(o),k);
async function dec(s,k){try{const r=await SEA.decrypt(s,k);return typeof r==='string'?JSON.parse(r):r}catch(e){return null}}
const err=(el,t)=>{$(el).textContent=t};

/* ---------- cuentas (Gun SEA); el alias es un hash, nadie ve el nombre de usuario ---------- */
function setMode(m){mode=m;$('#tL').classList.toggle('on',m==='login');$('#tR').classList.toggle('on',m==='reg');$('#fN').classList.toggle('hidden',m==='login');$('#go').textContent=m==='login'?'Entrar':'Crear cuenta';$('#ae').textContent=''}
$('#tL').onclick=()=>setMode('login');$('#tR').onclick=()=>setMode('reg');
const ack=(fn,ms=20000)=>new Promise((res,rej)=>{const t=setTimeout(()=>rej({err:'timeout'}),ms);fn(a=>{clearTimeout(t);a&&a.err?rej(a):res(a)})});
$('#af').onsubmit=async e=>{
  e.preventDefault();err('#ae','');
  const u=$('#u').value.trim().toLowerCase(),pw=$('#p').value;
  if(!/^[a-z0-9_.-]{3,24}$/.test(u))return err('#ae','Usuario: de 3 a 24 caracteres (letras, números, punto, guion o guion bajo).');
  if(pw.length<6)return err('#ae','La contraseña debe tener al menos 6 caracteres.');
  $('#go').disabled=true;const old=$('#go').textContent;$('#go').textContent='Conectando…';
  try{
    const alias=await sha('hilos:'+u);
    if(mode==='reg'){
      try{await ack(f=>user.create(alias,pw,f))}catch(x){return err('#ae',/already/i.test(x.err||'')?'Ese usuario ya existe.':'No se pudo crear la cuenta. Inténtalo de nuevo.')}
      await ack(f=>user.auth(alias,pw,f));
      const name=$('#dn').value.trim().slice(0,30)||u;
      user.get('profile').put({display:name,epub:user.is.epub});
      await start(name);
    }else{
      try{await ack(f=>user.auth(alias,pw,f))}catch(x){return err('#ae',x.err==='timeout'?'No se pudo contactar con la red. Inténtalo de nuevo.':'Usuario o contraseña incorrectos.')}
      await start();
    }
    $('#p').value='';
  }finally{$('#go').disabled=false;$('#go').textContent=old}
};
$('#out').onclick=()=>{try{user.leave()}catch(e){}sessionStorage.clear();location.reload()};
user.recall({sessionStorage:true});
gun.on('auth',()=>{if(!me&&user.is)start()});
let hi=false;gun.on('hi',()=>{hi=true;$('#net').classList.add('hidden')});
setTimeout(()=>{if(!hi){$('#net').classList.remove('hidden');$('#net').textContent='Sin conexión con los servidores de Gun. Revisa tu red o cambia PEERS.'}},8000);

async function start(name){
  if(me||!user.is)return;
  me={p:user.is.pub,e:user.is.epub,pair:user._.sea,n:name||'Yo'};
  $('#auth').classList.add('hidden');$('#app').classList.remove('hidden');
  try{LR=JSON.parse(localStorage.getItem('hs_lr_'+me.p)||'{}')}catch(e){}
  if(!name){const p=await once(user.get('profile'),5000);if(p&&p.display)me.n=p.display}
  $('#meAv').innerHTML=av(me);
  watchInbox();render();
}

/* ---------- cifrado y datos ----------
   Cada hilo tiene una clave K aleatoria. K se cifra para cada miembro con un secreto compartido (ECDH) y se deja en su buzón.
   Asunto, miembros y mensajes se cifran con K: los relays solo ven datos ilegibles. */
function watchInbox(){
  const pend={};
  G.get('inbox').get(me.p).map().on(async(d,id)=>{
    if(!d||!d.k||!d.fe||T[id]||pend[id])return;pend[id]=1;
    try{const K=await SEA.decrypt(d.k,await SEA.secret(d.fe,me.pair));if(!K||typeof K!=='string')return;
      T[id]={id,K,msgs:{},seen:{}};loadThread(T[id])}catch(e){}
  });
}
function loadThread(t){
  const N=G.get('t').get(t.id);
  N.get('meta').on(async d=>{if(!d||!d.d)return;const m=await dec(d.d,t.K);if(m&&m.subject!=null){Object.assign(t,{subject:m.subject,members:m.members,ts0:m.ts});render()}});
  N.get('msgs').map().on(async(d,id)=>{
    if(!d||!d.d||t.seen[id])return;t.seen[id]=1;
    const m=await dec(d.d,t.K);if(m&&m.text){t.msgs[id]=m;render()}
  });
}
async function findUser(name){
  name=name.trim().toLowerCase().replace(/^@/,'');
  const d=await once(gun.get('~@'+await sha('hilos:'+name)));
  const k=d&&Object.keys(d).find(x=>x[0]==='~');if(!k)return null;
  const p=await once(gun.get(k).get('profile'));
  return p&&p.epub?{p:k.slice(1),e:p.epub,n:p.display||name}:null;
}
async function sendMsg(t,text){
  const id=rid(),m={from:me.p,text,ts:Date.now()};
  t.seen[id]=1;t.msgs[id]=m;render();
  G.get('t').get(t.id).get('msgs').get(id).put({d:await enc(m,t.K)});
}
async function createThread(rec,subject,text){
  const id=rid(),K=key(),members=[{p:me.p,n:me.n},...rec.map(r=>({p:r.p,n:r.n}))];
  G.get('t').get(id).get('meta').put({d:await enc({subject,members,ts:Date.now()},K)});
  for(const m of [{p:me.p,e:me.e},...rec]){
    const k=await SEA.encrypt(K,await SEA.secret(m.e,me.pair));
    G.get('inbox').get(m.p).get(id).put({fe:me.e,k,ts:Date.now()});
  }
  const t=T[id]={id,K,msgs:{},seen:{},subject,members,ts0:Date.now()};
  await sendMsg(t,text);return id;
}

/* ---------- interfaz ---------- */
const msgsOf=t=>Object.values(t.msgs).sort((a,b)=>a.ts-b.ts);
const unread=t=>msgsOf(t).filter(m=>m.from!==me.p&&m.ts>(LR[t.id]||0)).length;
function markRead(t){const l=msgsOf(t).pop();LR[t.id]=Math.max(Date.now(),l?l.ts:0);try{localStorage.setItem('hs_lr_'+me.p,JSON.stringify(LR))}catch(e){}}
const others=t=>(t.members||[]).filter(m=>m.p!==me.p);
const label=t=>{const o=others(t);return o.length<=2?o.map(m=>m.n).join(', '):`${o[0].n}, ${o[1].n} y ${o.length-2} más`};
function pane(n){$('#ph').classList.toggle('hidden',n!=='ph');$('#tv').classList.toggle('hidden',n!=='tv');$('#cv').classList.toggle('hidden',n!=='cv');document.body.classList.toggle('open',n!=='ph')}
const home=()=>{open=null;pane('ph');render()};
$('#b1').onclick=home;$('#b2').onclick=home;$('#nc').onclick=home;

let rt;function render(){clearTimeout(rt);rt=setTimeout(draw,50)}
function draw(){
  if(!me)return;
  const ql=q.toLowerCase();
  const arr=Object.values(T).filter(t=>t.subject!=null).map(t=>({t,l:msgsOf(t).pop()})).filter(x=>x.l)
    .filter(x=>!ql||(x.t.subject+' '+label(x.t)+' '+x.l.text).toLowerCase().includes(ql)).sort((a,b)=>b.l.ts-a.l.ts);
  const n=Object.values(T).filter(t=>t.subject!=null&&unread(t)).length;document.title=n?`(${n}) Hilos`:'Hilos';
  $('#list').innerHTML=arr.length?arr.map(({t,l})=>{
    const u=unread(t),o=others(t),w=l.from===me.p?'Tú':((t.members||[]).find(m=>m.p===l.from)||{n:'?'}).n.split(' ')[0];
    return `<button class="row${u?' un':''}${t.id===open?' cur':''}" data-id="${t.id}">${o.length===1?av(o[0]):`<span class="av g" aria-hidden="true">${t.members.length}</span>`}
      <div class="rb"><div class="r1"><span class="subj">${esc(t.subject)}</span><span class="time">${lt(l.ts)}</span></div>
      <div class="ppl">${esc(label(t))}</div>
      <div class="r3"><span class="snip">${esc(w)}: ${esc(l.text.replace(/\s+/g,' '))}</span>${u?`<span class="badge">${u}</span>`:''}</div></div></button>`}).join('')
    :`<div class="empty">${ql?'Nada coincide con tu búsqueda.':'Aún no hay hilos. Empieza uno nuevo.'}</div>`;
  const t=T[open];if(!t||t.subject==null)return;
  if(!document.hidden)markRead(t);
  $('#ts').textContent=t.subject;
  $('#stk').innerHTML=others(t).slice(0,3).map(m=>av(m)).join('');
  $('#tp').textContent=others(t).length===1?'':`${t.members.length} personas: ${others(t).map(m=>m.n).join(', ')}`;
  const box=$('#msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<140,grp=t.members.length>2;
  let h='',ld='',lf='',lts=0;
  msgsOf(t).forEach(m=>{
    const dk=new Date(m.ts).toDateString();if(dk!==ld){h+=`<div class="day"><span>${dayL(m.ts)}</span></div>`;ld=dk;lf=''}
    const mine=m.from===me.p,f=m.from!==lf||m.ts-lts>300000,who=t.members.find(x=>x.p===m.from)||{p:m.from,n:'?'};
    h+=`<div class="msg ${mine?'me':'th'}${f?' f':''}">${f&&!mine&&grp?`<div class="mn" style="color:hsl(${hue(who.p)} 55% 50%)">${esc(who.n)}</div>`:''}<div class="bub">${link(m.text)}<span class="mt">${hhmm(m.ts)}</span></div></div>`;
    lf=m.from;lts=m.ts});
  box.innerHTML=h;if(near||box.dataset.s!==t.id){box.scrollTop=box.scrollHeight;box.dataset.s=t.id}
}
$('#list').onclick=e=>{const r=e.target.closest('.row');if(!r)return;open=r.dataset.id;pane('tv');draw();$('#rp').focus()};
$('#q').oninput=e=>{q=e.target.value.trim();draw()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});

const rp=$('#rp'),touch=matchMedia('(pointer:coarse)').matches;
rp.addEventListener('input',()=>{rp.style.height='auto';rp.style.height=Math.min(rp.scrollHeight,150)+'px'});
rp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!touch){e.preventDefault();reply()}});
$('#sd').onclick=reply;
function reply(){const t=T[open],x=rp.value.trim();if(!t||!x)return;rp.value='';rp.style.height='auto';sendMsg(t,x.slice(0,5000));rp.focus()}

/* ---------- nuevo hilo ---------- */
function chips(){$('#chips').innerHTML=cmp.map(r=>`<span class="chip">${esc(r.n)}<button type="button" data-p="${esc(r.p)}" aria-label="Quitar ${esc(r.n)}">×</button></span>`).join('')}
async function addTo(){
  const v=$('#to').value.trim();if(!v)return;err('#ne','Buscando…');
  const r=await findUser(v);
  if(!r)return err('#ne',`No se encontró a "${v}". Si la cuenta es nueva, espera unos segundos y reintenta.`);
  err('#ne','');if(r.p!==me.p&&!cmp.some(c=>c.p===r.p))cmp.push(r);$('#to').value='';chips();
}
$('#chips').onclick=e=>{const b=e.target.closest('button');if(b){cmp=cmp.filter(r=>r.p!==b.dataset.p);chips()}};
$('#to').addEventListener('keydown',e=>{
  if(['Enter',',',' '].includes(e.key)&&e.target.value.trim()){e.preventDefault();addTo()}
  else if(e.key==='Backspace'&&!e.target.value){cmp.pop();chips()}});
$('#fab').onclick=()=>{cmp=[];chips();['#to','#ns','#nt'].forEach(s=>$(s).value='');err('#ne','');open=null;draw();pane('cv');$('#to').focus()};
$('#nf').onsubmit=async e=>{
  e.preventDefault();$('#ng').disabled=true;
  try{
    if($('#to').value.trim())await addTo();
    if(!cmp.length)return err('#ne','Añade al menos un destinatario.');
    const text=$('#nt').value.trim();if(!text)return err('#ne','Escribe un mensaje.');
    const id=await createThread(cmp,$('#ns').value.trim().slice(0,120)||text.split('\n')[0].slice(0,60),text.slice(0,5000));
    open=id;pane('tv');draw();
  }catch(x){err('#ne','No se pudo enviar. Inténtalo de nuevo.')}
  finally{$('#ng').disabled=false}
};
})();
</script>
